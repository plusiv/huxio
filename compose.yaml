name: huxio

# The whole stack: Postgres, a migration job, an API node, two workers, and the
# metrics pair. Split roles here rather than a single --role=all process
# because that is how huxio is meant to be deployed, and running it this way
# locally means the split is exercised rather than assumed.
#
#   make keygen-env      write the two required secrets into .env
#   docker compose up -d
#
# API on :8080, Prometheus on :9090, Grafana on :3000 (admin/admin).

x-huxio-env: &huxio-env
  HUXIO_DATABASE_URL: postgres://postgres:postgres@postgres:5432/huxio?sslmode=disable
  # Seals endpoint signing secrets at rest. Comma-separated for rotation:
  # newest key first. Generate one with `go run ./cmd/huxio keygen`.
  HUXIO_ENCRYPTION_KEY: ${HUXIO_ENCRYPTION_KEY:?set it in .env, e.g. via "make keygen-env"}
  HUXIO_JWT_SECRET: ${HUXIO_JWT_SECRET:?set it in .env, e.g. via "make keygen-env"}
  HUXIO_LOG_LEVEL: ${HUXIO_LOG_LEVEL:-info}
  HUXIO_PORTAL_BASE_URL: ${HUXIO_PORTAL_BASE_URL:-http://localhost:8080}
  # The SSRF guard blocks private addresses, which includes this compose
  # network. Set HUXIO_ALLOW_SUBNETS in .env to the compose subnet if you want
  # to deliver to a test receiver running as a sibling container:
  #   docker network inspect huxio_default --format '{{(index .IPAM.Config 0).Subnet}}'
  HUXIO_ALLOW_SUBNETS: ${HUXIO_ALLOW_SUBNETS:-}

x-huxio-image: &huxio-image
  build:
    context: .
    args:
      VERSION: ${VERSION:-compose}
  image: huxio:${VERSION:-compose}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: huxio
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Runs to completion before anything else starts, so no node ever serves
  # against a schema that is not there yet.
  migrate:
    <<: *huxio-image
    command: ["migrate", "up"]
    environment: *huxio-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *huxio-image
    command: ["serve", "--role=api"]
    environment: *huxio-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Two workers so the partition leases actually have to split the 256
  # partitions, which is the interesting path. Scale with:
  #   docker compose up -d --scale worker=4
  worker:
    <<: *huxio-image
    command: ["serve", "--role=worker"]
    environment: *huxio-env
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
