name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same checks ci.yml runs, repeated here because a tag can be pushed to a
  # commit CI never saw, and a broken tag cannot be taken back once people have
  # pulled it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        run: go test -race $(go list ./... | grep -v '/tests/integrations')
      - name: Integration tests (race)
        run: go test -race -count=1 ./tests/integrations/...

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the archives
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the tag history to build the changelog, so a
          # shallow clone gives it nothing to work from.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Needed for the arm64 image: buildx builds it, QEMU lets this amd64
      # runner execute the `RUN` in Dockerfile.release under it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
