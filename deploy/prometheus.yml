global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: huxio
    metrics_path: /metrics
    static_configs:
      # host.docker.internal reaches a huxio running on the host; swap for the
      # service name when huxio itself runs in compose.
      - targets: ["host.docker.internal:8080"]
