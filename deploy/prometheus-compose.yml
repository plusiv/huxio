# Prometheus config for the root compose.yaml, where huxio runs in containers
# alongside it. deploy/prometheus.yml is the variant for a huxio running on the
# host with only the dependencies in Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: huxio-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # Workers are replicas behind one service name, so resolve the A records to
  # scrape every one of them rather than whichever the DNS round-robin picks.
  - job_name: huxio-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8080
